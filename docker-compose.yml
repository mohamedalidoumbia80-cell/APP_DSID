services:
  db:
    image: postgres:18-alpine
    container_name: dsid_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsid
      POSTGRES_USER: dsid
      POSTGRES_PASSWORD: ${DSID_DB_PASSWORD:-change_me_locally}
    ports:
      - "7001:5432"
    volumes:
      - dsid_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsid -d dsid"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dsid_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsid_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./dsid:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - dsid_network
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    image: app_dsid-app
    container_name: dsid_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./dsid:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - dsid_network
    depends_on:
      db:
        condition: service_healthy

  queue:
    image: app_dsid-app
    container_name: dsid_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3
    volumes:
      - ./dsid:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - dsid_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: dsid_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dsid:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dsid_network
    depends_on:
      - app

networks:
  dsid_network:
    driver: bridge

volumes:
  dsid_postgres_data:
